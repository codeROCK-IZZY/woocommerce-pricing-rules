name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress coding standards (WPCS 3, PHPCompatibility 8.1+)
        run: vendor/bin/phpcs
      - name: PHPStan level 8 with WordPress stubs
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: JavaScript syntax
        run: node --check assets/admin.js

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  evaluate:
    name: Evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: php eval/run.php --gate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval/reports/

  integration:
    name: WooCommerce ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "latest on WordPress latest"
            image: wordpress:php8.3-apache
            wc: ""
          - label: "9.9 on WordPress 6.7"
            image: wordpress:6.7-php8.3-apache
            wc: "9.9.5"
    env:
      WP_IMAGE: ${{ matrix.image }}
      WC_VERSION: ${{ matrix.wc }}
    steps:
      - uses: actions/checkout@v4
      - name: Let the WordPress containers write to the plugin folder
        run: chmod -R a+rwX .
      - run: bash tests/integration/run.sh
      - if: failure()
        run: docker compose logs wordpress | tail -100

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --no-banner
